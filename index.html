<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f4249" />
  <title>Ground Truth Observations</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
  <header>
    <div class="brand-mark">R</div>
    <div>
      <h1>Ground Truth Observations</h1>
      <p>GPS-based trail observations</p>
    </div>
  </header>

  <main>
    <section class="card form-card">
      <div class="section-title">
        <span class="step">1</span>
        <h2>New observation</h2>
      </div>

      <div class="gps-status">
        <div>
          <strong>📍 GPS position</strong>
          <div id="coordinates" class="small">Waiting for location…</div>
        </div>
        <span id="gpsStatus" class="accuracy">Waiting…</span>
      </div>

      <div id="trackingControls" class="tracking-controls hidden">
        <button type="button" id="startTracking" class="secondary-button">Start tracking</button>
        <button type="button" id="stopTracking" class="secondary-button danger" disabled>End tracking</button>
        <div id="trackingStatus" class="tracking-status">No route in progress</div>
      </div>

      <label for="type">Observation category</label>
      <select id="type">
        <option value="Track >1 m wide sections">Track >1 m wide sections (blue trails)</option>
        <option value="Track and measure width">Track and measure width (green trails)</option>
        <option value="Track faint trails">Track faint trails</option>
        <option value="Mark wet trail">Mark wet trail</option>
        <option value="Mark erosion">Mark erosion</option>
      </select>

      <div id="widthField">
        <label for="widthCategory">Trail width category</label>
        <select id="widthCategory">
          <option value="">-- Select one --</option>
          <option value="< 50 cm">&lt; 50 cm</option>
          <option value="50–100 cm">50–100 cm</option>
          <option value="> 100 cm">&gt; 100 cm</option>
        </select>
      </div>

      <div id="wetTrailConditionField">
        <label for="wetTrailCondition">Wet trail condition</label>
        <select id="wetTrailCondition">
          <option value="">-- Select one --</option>
          <option value="Running water">Running water</option>
          <option value="Standing water">Standing water</option>
          <option value="Muddy">Muddy</option>
        </select>
      </div>

      <div id="erosionTypeField">
        <label for="erosionType">Erosion type</label>
        <select id="erosionType">
          <option value="">-- Select one --</option>
          <option value="Big hole">Big hole</option>
          <option value="Big rock on trail">Big rock on trail</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <label for="note">Remark <span>(optional)</span></label>
      <textarea id="note" placeholder="Add any additional notes or observations..." rows="4"></textarea>

      <label for="photo">Photo <span>(optional)</span></label>
      <label for="photo" id="photoButton" class="photo-picker-button" tabindex="0" role="button"
        aria-label="Take a photo">Take a photo</label>
      <input id="photo" class="file-input hidden-file-input" type="file" accept="image/*" capture="environment" />
      <div class="photo-help">If your browser asks for camera access, allow it.
      </div>
      <div id="photoPreview" class="photo-preview hidden">
        <img id="previewImage" alt="Selected observation" />
        <button type="button" id="removePhoto" class="secondary-button">Remove photo</button>
      </div>

      <button id="save">Save observation</button>
      <div id="message" class="message"></div>
    </section>

    <section class="card map-card">
      <div class="map-header">
        <div class="section-title">
          <span class="step">2</span>
          <h2>Shared observations</h2>
        </div>
        <div class="map-actions">
          <button id="myLocationButton" type="button" class="secondary-button location-button">My Location</button>
          <span id="count" class="count">0</span>
        </div>
      </div>
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
