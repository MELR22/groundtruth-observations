<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f4249" />
  <title>Ground Truth Observations</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
  <header>
    <div class="brand-mark">R</div>
    <div>
      <h1>Ground Truth Observations</h1>
      <p>GPS-based trail observations</p>
    </div>
  </header>

  <main>
    <section class="card form-card">
      <div class="section-title">
        <span class="step">1</span>
        <h2>New observation</h2>
      </div>

      <label for="group">Group</label>
      <select id="group">
        <option value="Group 1">Group 1</option>
        <option value="Group 2">Group 2</option>
        <option value="Group 3">Group 3</option>
        <option value="Group 4">Group 4</option>
      </select>

      <div class="gps-status">
        <div>
          <strong>📍 GPS position</strong>
          <div id="coordinates" class="small">Waiting for location…</div>
        </div>
        <span id="gpsStatus" class="accuracy">Waiting…</span>
      </div>

      <div id="trackingControls" class="tracking-controls hidden">
        <button type="button" id="startTracking" class="secondary-button">Start tracking</button>
        <button type="button" id="stopTracking" class="secondary-button danger" disabled>End tracking</button>
        <div id="trackingStatus" class="tracking-status">No route in progress</div>
      </div>

      <label for="type">Observation category</label>
      <select id="type">
        <option value="Trail width">Trail width</option>
        <option value="Cairn">Cairn </option>
        <option value="Wet trail">Wet trail</option>
        <option value="Track trail">Track trail</option>
        <option value="Other">Other</option>
      </select>

      <div id="widthField">
        <label for="measurement">Trail width (in meter)</label>
        <div class="measurement-row">
          <input id="measurement" type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="e.g. 1.25" />
          <span>metres</span>
        </div>

        <label for="surfaceCondition">Surface Condition</label>
        <select id="surfaceCondition">
          <option value="">-- Select one --</option>
          <option value="Lightly Worn">Still vegetation cover, but affected by trampling</option>
          <option value="Root Exposed">Mostly roots</option>
          <option value="Mixed grass and bare soil">Mostly grass and moss</option>
          <option value="Barren Core">Mostly barren soil</option>
        </select>

        <label for="trailArchitecture">Trail Architecture</label>
        <select id="trailArchitecture">
          <option value="">-- Select one --</option>
          <option value="Single trail">Single trail</option>
          <option value="Braided/Parallel trail">Braided/parallel trails</option>
        </select>
      </div>

      <div id="wetTrailConditionField">
        <label for="wetTrailCondition">Wet trail condition</label>
        <select id="wetTrailCondition">
          <option value="">-- Select one --</option>
          <option value="Water running">Water running</option>
          <option value="Water standing">Water standing</option>
          <option value="Muddy">Muddy</option>
        </select>
      </div>

      <div id="cairnHeightField">
        <label for="cairnHeight">Cairn height (in meter)</label>
        <div class="measurement-row">
          <input id="cairnHeight" type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="e.g. 1.25" />
          <span>metres</span>
        </div>
      </div>

      <div id="cairnDiameterField">
        <label for="cairnDiameter">Cairn diameter (in meter)</label>
        <div class="measurement-row">
          <input id="cairnDiameter" type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*"
            placeholder="e.g. 1.25" />
          <span>metres</span>
        </div>
      </div>

      <label for="note">Description <span>(optional)</span></label>
      <textarea id="note" placeholder="Add any additional notes or observations..." rows="4"></textarea>

      <label for="photo">Photo <span>(optional)</span></label>
      <button id="photoButton" type="button" class="photo-picker-button">Take a photo</button>
      <input id="photo" class="file-input hidden-file-input" type="file" accept="image/*" capture="environment" />
      <div class="photo-help">If your browser asks for camera access, allow it. You can also choose an existing image.
      </div>
      <div id="photoPreview" class="photo-preview hidden">
        <img id="previewImage" alt="Selected observation" />
        <button type="button" id="removePhoto" class="secondary-button">Remove photo</button>
      </div>

      <button id="save">Save observation</button>
      <div id="message" class="message"></div>
    </section>

    <section class="card map-card">
      <div class="map-header">
        <div class="section-title">
          <span class="step">2</span>
          <h2>Shared observations</h2>
        </div>
        <span id="count" class="count">0</span>
      </div>
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
